[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "needtoknow"
version = "0.0.0"
description = "Sign-in, audit log, rate limit and billed model calls for an internal company agent."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Wang Jiacheng" }]
dependencies = [
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-anthropic>=1.7",
    "typesafe-sdk>=0.7",
    "pydantic-settings>=2.16",
    "limits>=5.8",
    "mcp>=2.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.7"]
ollama = ["langchain-ollama>=1.1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["needtoknow"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert and throwaway passwords are the pytest idiom
"tests/**" = ["S101", "S105", "S106"]
"bench/test_*.py" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: calls the paid model API, deselected by default, run with -m llm",
]
addopts = "-m 'not llm'"
