[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deskclerk"
version = "0.0.0"
description = "An internal company agent that works on a company's MCP servers with each employee's own accounts."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Wang Jiacheng" }]
dependencies = [
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-anthropic>=1.7",
    "typesafe-sdk>=0.7",
    "pydantic-settings>=2.16",
    "limits>=5.8",
    "mcp>=2.3",
    "jsonschema>=4.26",
    "fastapi>=0.142",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
tracing = ["langfuse>=5,<6"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["deskclerk"]

[tool.setuptools.package-data]
deskclerk = ["static/*.html"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# assert and throwaway passwords are the pytest idiom
"tests/**" = ["S101", "S105", "S106"]
"bench/test_*.py" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: calls the paid model API, deselected by default, run with -m llm",
    "keycloak: signs in against the development Keycloak from compose.yaml",
]
addopts = "-m 'not llm'"
