[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "needtoknow"
version = "0.0.0"
description = "Open-source AI data agent with database-enforced permissions."
requires-python = ">=3.12"
authors = [{ name = "Wang Jiacheng" }]
dependencies = [
    "psycopg[binary]>=3.3",
    "fastembed>=0.9",
    "pgvector>=0.5",
    "pyjwt[crypto]>=2.10",
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-anthropic>=1.7",
    "mcp>=2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["needtoknow"]

[tool.setuptools.package-data]
needtoknow = ["static/chat.html", "sql/*.sql"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom
"tests/**" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "keycloak: needs the Keycloak server from compose.yaml",
    "llm: calls the paid model API, deselected by default, run with -m llm",
]
addopts = "-m 'not llm'"
