[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "needtoknow"
version = "0.0.0"
description = "Open-source AI data agent with database-enforced permissions."
requires-python = ">=3.12"
authors = [{ name = "Wang Jiacheng" }]
dependencies = [
    "psycopg[binary]>=3.3",
    "fastembed>=0.9",
    "pgvector>=0.5",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-text-splitters>=1.1",
    "langchain-anthropic>=1.7",
    "mcp>=2.3",
    "typesafe-sdk>=0.7",
    "pydantic-settings>=2.16",
    "psycopg-pool>=3.3",
    "limits>=5.8",
]

[project.optional-dependencies]
eval = ["scipy>=1.18", "thefuzz>=0.22"]
openai = ["langchain-openai>=1.7"]
ollama = ["langchain-ollama>=1.1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["needtoknow"]

[tool.setuptools.package-data]
needtoknow = ["static/chat.html", "sql/*.sql"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert and throwaway passwords are the pytest idiom
"tests/**" = ["S101", "S105", "S106"]
# the development passwords from compose.yaml
"src/needtoknow/config.py" = ["S105"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# thefuzz ships no type information
module = ["thefuzz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "keycloak: needs the Keycloak server from compose.yaml",
    "llm: calls the paid model API, deselected by default, run with -m llm",
]
addopts = "-m 'not llm'"
