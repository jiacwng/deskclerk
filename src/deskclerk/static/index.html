<!doctype html>
<!-- The chat page: sign in, connect servers, ask. Model and tool text is set with textContent only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskclerk</title>
<style>
body { font: 16px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
h1, h2 { margin: 1.5rem 0 0.5rem; }
li { margin: 0.25rem 0; }
textarea { width: 100%; box-sizing: border-box; min-height: 6rem; }
pre { white-space: pre-wrap; background: #f3f3f3; padding: 0.5rem; }
.error { color: #b00020; }
.muted { color: #666; }
.verdict { margin-left: 0.5rem; font-weight: bold; }
@media (prefers-color-scheme: dark) {
  body { background: #161616; color: #eee; }
  pre { background: #2a2a2a; }
  a { color: #8ab4f8; }
  .muted { color: #aaa; }
  .error { color: #ff8a80; }
}
</style>
</head>
<body>
<h1>deskclerk</h1>
<p id="status" class="muted"></p>
<p id="signin" hidden><a href="/login">Sign in</a></p>

<section id="app" hidden>
  <h2>Servers</h2>
  <ul id="servers"></ul>

  <h2>Ask</h2>
  <div id="turns"></div>
  <textarea id="request" maxlength="4000"></textarea>
  <p>
    <button id="ask" type="button">Ask</button>
    <button id="new-conversation" type="button">New conversation</button>
  </p>
  <p id="error" class="error"></p>
  <div id="confirm" hidden>
    <h2>Confirm changes</h2>
    <p class="muted">Each call below changes data. Approve or reject each one, then press Send.</p>
    <ul id="pending"></ul>
    <p><button id="send" type="button" disabled>Send</button></p>
  </div>
  <div id="result" hidden>
    <h2>Answer</h2>
    <pre id="answer"></pre>
    <h2>Calls</h2>
    <ul id="calls"></ul>
    <p id="cost" class="muted"></p>
  </div>
</section>

<script>
async function api(path, options) {
  const response = await fetch(path, options);
  if (response.status === 401) window.location.assign("/login");
  return response;
}

const post = (path, body) => api(path, {
  method: "POST",
  headers: { "X-Requested-With": "deskclerk", "Content-Type": "application/json" },
  body: body === undefined ? undefined : JSON.stringify(body),
});

const el = (id) => document.getElementById(id);

let conversation = null;

async function detail(response) {
  try {
    const body = await response.json();
    return typeof body.detail === "string" ? body.detail : response.statusText;
  } catch {
    return response.statusText;
  }
}

function showError(text) {
  el("error").textContent = text;
}

function line(text) {
  const item = document.createElement("li");
  item.textContent = text;
  return item;
}

function button(label, onClick) {
  const control = document.createElement("button");
  control.type = "button";
  control.textContent = label;
  control.addEventListener("click", onClick);
  return control;
}

async function connect(name) {
  const response = await post("/servers/" + encodeURIComponent(name) + "/connect");
  if (!response.ok) return showError(await detail(response));
  const target = new URL((await response.json()).authorization_url);
  if (target.protocol !== "https:" && target.protocol !== "http:") return showError("bad link");
  window.location.assign(target.href);
}

async function disconnect(name) {
  const response = await post("/servers/" + encodeURIComponent(name) + "/disconnect");
  if (!response.ok) return showError(await detail(response));
  loadServers();
}

async function loadServers() {
  const response = await api("/servers");
  if (!response.ok) return showError(await detail(response));
  const list = el("servers");
  list.replaceChildren();
  for (const server of await response.json()) {
    const item = line(server.name + (server.connected ? " (connected) " : " (not connected) "));
    item.append(
      server.connected
        ? button("Disconnect", () => disconnect(server.name))
        : button("Connect", () => connect(server.name)),
    );
    list.append(item);
  }
}

function showCalls(result) {
  const calls = el("calls");
  calls.replaceChildren();
  for (const call of result.executed) {
    const args = JSON.stringify(call.arguments);
    calls.append(line(call.server + "." + call.tool + " " + args + " -> " + call.result));
  }
  for (const call of result.blocked) {
    calls.append(line("blocked " + call.server + "." + call.tool + ": " + call.reason));
  }
  for (const name of result.not_connected) {
    calls.append(line(name + " is not connected, so its tools were not offered"));
  }
  for (const name of result.unavailable) {
    calls.append(line(name + " did not answer, so its tools were not offered"));
  }
  for (const name of result.changed_tools) {
    calls.append(line(name + " was changed since you first used its server, so it was not offered. Disconnect and connect the server to accept the change"));
  }
  if (result.cut_off) {
    calls.append(line("The reply was cut off at the output limit, so the answer above is incomplete"));
  }
}

function showAsked(request) {
  const asked = document.createElement("p");
  asked.className = "muted";
  asked.textContent = "You: " + request;
  el("turns").append(asked);
}

function showReply(answer) {
  const replied = document.createElement("pre");
  replied.textContent = answer;
  el("turns").append(replied);
}

function newConversation() {
  conversation = null;
  el("turns").replaceChildren();
  el("result").hidden = true;
  showPending([]);
  showError("");
}

let decisions = {};

function showPending(pending) {
  decisions = {};
  const list = el("pending");
  list.replaceChildren();
  for (const call of pending) {
    const verdict = document.createElement("span");
    verdict.className = "verdict";
    const decide = (choice) => {
      decisions[call.id] = choice;
      verdict.textContent = choice === "approve" ? "Approved" : "Rejected";
      el("send").disabled = Object.keys(decisions).length < pending.length;
    };
    const item = line(call.server + "." + call.tool + " " + JSON.stringify(call.arguments) + " ");
    item.append(button("Approve", () => decide("approve")), button("Reject", () => decide("reject")), verdict);
    list.append(item);
  }
  el("send").disabled = true;
  el("confirm").hidden = pending.length === 0;
  el("ask").disabled = pending.length > 0;
}

function showResult(result) {
  conversation = result.conversation;
  if (result.pending.length === 0) showReply(result.answer);
  el("answer").textContent = result.answer;
  showCalls(result);
  showPending(result.pending);
  el("cost").textContent = "Cost: " + result.cost_usd.toFixed(4) + " USD";
  el("result").hidden = false;
}

async function ask() {
  showError("");
  const request = el("request").value;
  const response = await post("/ask", { request, conversation });
  if (!response.ok) return showError(await detail(response));
  showAsked(request);
  el("request").value = "";
  showResult(await response.json());
}

async function send() {
  showError("");
  const response = await post("/ask/confirm", { conversation, decisions });
  if (!response.ok) {
    if (response.status >= 500) showPending([]);
    return showError(await detail(response));
  }
  showResult(await response.json());
}

async function start() {
  const response = await api("/me");
  if (!response.ok) {
    el("signin").hidden = false;
    return;
  }
  el("status").textContent = "Signed in as " + (await response.json()).name;
  el("app").hidden = false;
  el("ask").addEventListener("click", ask);
  el("send").addEventListener("click", send);
  el("new-conversation").addEventListener("click", newConversation);
  loadServers();
}

start();
</script>
</body>
</html>
