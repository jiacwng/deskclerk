<!doctype html>
<!-- The chat page: sign in, connect servers, ask. Tool text is set with textContent only; answers are markdown cleaned by DOMPurify. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskclerk</title>
<style>
:root {
  --bg: #f4f3ef;
  --rail: #eceae4;
  --surface: #fbfaf8;
  --sunk: #e7e5de;
  --line: #d6d3ca;
  --line-soft: #e2dfd7;
  --edge: #85827a;
  --fg: #1d1f1c;
  --muted: #5d6159;
  --accent: #1f5a55;
  --accent-fg: #f6faf9;
  --ok: #2b7345;
  --warn: #8a5600;
  --warn-soft: #f1e6cc;
  --bad: #ae2a22;
  --bad-soft: #f4dfdb;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161815;
    --rail: #1b1d1a;
    --surface: #1f221e;
    --sunk: #292c27;
    --line: #373a34;
    --line-soft: #2d302b;
    --edge: #7a7e74;
    --fg: #e5e6e0;
    --muted: #9fa399;
    --accent: #7fc3b8;
    --accent-fg: #0f1a18;
    --ok: #7cc795;
    --warn: #e0b454;
    --warn-soft: #302a18;
    --bad: #ee9d93;
    --bad-soft: #3a2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161815;
  --rail: #1b1d1a;
  --surface: #1f221e;
  --sunk: #292c27;
  --line: #373a34;
  --line-soft: #2d302b;
  --edge: #7a7e74;
  --fg: #e5e6e0;
  --muted: #9fa399;
  --accent: #7fc3b8;
  --accent-fg: #0f1a18;
  --ok: #7cc795;
  --warn: #e0b454;
  --warn-soft: #302a18;
  --bad: #ee9d93;
  --bad-soft: #3a2220;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { accent-color: var(--accent); scrollbar-color: var(--line) transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 0.9375rem/1.5 var(--sans);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
[hidden] { display: none !important; }
::selection { background: var(--accent); color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { caret-color: var(--accent); }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }

.bar { border-bottom: 1px solid var(--line); flex: none; }
.bar-inner, .shell {
  max-width: 72rem;
  margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { display: flex; align-items: center; gap: 0.75rem; min-height: 2.75rem; }
.brand { font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
.who { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }

.rail { padding-block: 1rem; min-height: 0; overflow-y: auto; }
.rail-toggle { display: none; }
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 0.45); }
.shell { display: grid; flex: 1; width: 100%; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
@media (min-width: 52rem) {
  .shell { grid-template-columns: 15rem minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); column-gap: 2rem; }
  .rail { border-right: 1px solid var(--line-soft); padding-right: 1rem; }
}
@media (max-width: 51.99rem) {
  .shell { grid-template-rows: minmax(0, 1fr); }
  .rail {
    position: fixed; inset-block: 0; left: 0; z-index: 20; width: min(20rem, 86vw);
    padding: 1rem 16px; background: var(--rail); border-right: 1px solid var(--line);
    translate: -100% 0; visibility: hidden;
  }
  .rail[data-open] { translate: 0 0; visibility: visible; }
  .rail-toggle { display: inline-flex; flex: none; white-space: nowrap; }
  .brand { white-space: nowrap; }
  #status { display: none; }
}
.heading { font-size: 0.8125rem; font-weight: 600; color: var(--muted); margin-bottom: 0.5rem; }

button, .link-button {
  font: inherit; font-size: 0.875rem; font-weight: 600; line-height: 1.2;
  min-height: 2.25rem; padding: 0.4rem 0.8rem;
  border-radius: 4px; border: 1px solid var(--edge);
  background: var(--surface); color: var(--fg);
  cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
}
button:hover:not(:disabled), .link-button:hover { background: var(--sunk); }
button:active:not(:disabled) { background: var(--line); }
button:disabled { color: var(--muted); background: transparent; border-style: dashed; cursor: not-allowed; }
button.primary, .link-button.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
button.primary:hover:not(:disabled), .link-button.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.primary:disabled { background: transparent; border-color: var(--line); color: var(--muted); }
button.quiet { background: transparent; border-color: transparent; color: var(--muted); }
button.quiet:hover:not(:disabled) { color: var(--fg); }
button.small { min-height: 1.875rem; padding: 0.2rem 0.6rem; font-size: 0.8125rem; }

.conv-new { width: 100%; margin-bottom: 0.5rem; }
.conv-list { display: grid; gap: 0.125rem; margin-bottom: 1.25rem; }
.conv { display: flex; align-items: stretch; border-radius: 4px; }
.conv:hover { background: var(--sunk); }
button.conv-open { flex: 1; min-width: 0; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 0; padding: 0.3rem 0.5rem; background: transparent; border-color: transparent; font-weight: 500; text-align: left; }
button.conv-open[aria-current="true"] { background: var(--sunk); border-color: var(--edge); }
.conv-title { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-time { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
button.conv-delete { flex: none; min-height: 0; padding: 0.2rem 0.5rem; font-size: 0.75rem; background: transparent; border-color: transparent; color: var(--muted); }
button.conv-delete:hover:not(:disabled) { color: var(--bad); }
.conv-confirm { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; padding: 0.3rem 0.5rem; border: 1px solid var(--bad); border-radius: 4px; }
.conv-confirm .small { flex-basis: 100%; }
.conv-empty { padding-block: 0.25rem; }

.servers { display: grid; }
.server { padding-block: 0.625rem; border-top: 1px solid var(--line-soft); display: grid; gap: 0.25rem; }
.server:first-child { border-top: 0; padding-top: 0; }
.server-name { font-weight: 600; }
.server-url { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.server-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: 0.25rem; }
.state { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8125rem; color: var(--muted); }
.state::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%; border: 1.5px solid var(--muted); }
.state.on { color: var(--ok); }
.state.on::before { background: var(--ok); border-color: var(--ok); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.thread { position: relative; flex: 1; min-height: 0; display: flex; }
.messages { position: relative; flex: 1; min-width: 0; overflow-y: auto; padding-top: 1rem; overscroll-behavior: contain; scrollbar-color: var(--line) transparent; }
.messages:focus-visible { outline-offset: -2px; }
.jump {
  position: absolute; left: 50%; bottom: 0.75rem; translate: -50% 0;
  border-radius: 999px; padding-inline: 1rem; box-shadow: 0 1px 6px rgb(0 0 0 / 0.25);
}
.empty { color: var(--muted); max-width: 40rem; margin-inline: auto; text-align: center; padding-block: 10vh 1.5rem; display: grid; gap: 0.75rem; justify-items: center; }
.empty-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
.chips:empty { display: none; }
.chip { border-radius: 999px; font-weight: 500; text-align: left; }
@media (max-width: 30rem) { .empty { padding-block: 4vh 1rem; } }
.turns { display: grid; gap: 1.75rem; padding-bottom: 1.5rem; }
.turn { display: grid; gap: 0.625rem; min-width: 0; }
.request { justify-self: end; max-width: min(85%, 36rem); background: var(--sunk); border-radius: 12px 12px 2px 12px; padding: 0.5rem 0.75rem; white-space: pre-wrap; font-weight: 500; }
.who-label { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 0.125rem; }
.answer { max-width: 68ch; line-height: 1.6; text-wrap: pretty; min-width: 0; }
.plain { white-space: pre-wrap; }
.answer > * + * { margin-top: 0.75rem; }
.answer h1, .answer h2, .answer h3, .answer h4, .answer h5, .answer h6 { margin-bottom: 0; font-size: 1rem; line-height: 1.4; }
.answer h1, .answer h2 { font-size: 1.0625rem; }
.answer ul, .answer ol { padding-left: 1.5rem; }
.answer ul { list-style: disc; }
.answer li + li { margin-top: 0.25rem; }
.answer li > ul, .answer li > ol { margin-top: 0.25rem; }
.answer a { color: var(--accent); text-underline-offset: 2px; }
.answer blockquote { margin-left: 0; padding-left: 0.75rem; border-left: 3px solid var(--line); color: var(--muted); }
.answer hr { border: 0; border-top: 1px solid var(--line); }
.answer code { font: 0.8125rem/1.5 var(--mono); background: var(--sunk); border-radius: 3px; padding: 0.05rem 0.3rem; overflow-wrap: anywhere; }
.answer pre { white-space: pre; overflow-wrap: normal; max-height: none; overflow-x: auto; overflow-y: hidden; }
.answer pre code { background: transparent; padding: 0; overflow-wrap: normal; }
.code-block { position: relative; }
.code-block pre { padding-right: 4.5rem; }
.code-copy { position: absolute; top: 0.25rem; right: 0.25rem; min-height: 1.5rem; padding: 0.1rem 0.5rem; font-size: 0.75rem; background: var(--surface); }
.answer + button { margin-top: 0.25rem; }
.answer table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 0.875rem; }
.answer th, .answer td { border: 1px solid var(--line); padding: 0.3rem 0.6rem; text-align: left; overflow-wrap: normal; }
.answer th { background: var(--sunk); }

.calls { display: grid; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.calls:empty { display: none; }
.call, .note { min-width: 0; border-top: 1px solid var(--line-soft); }
.calls > :first-child { border-top: 0; }
.call summary, .note {
  display: grid; grid-template-columns: 9rem minmax(0, 1fr); align-items: baseline; column-gap: 0.75rem;
  padding: 0.4rem 0.75rem; font-size: 0.8125rem;
}
.call summary { cursor: pointer; list-style: none; grid-template-columns: 9rem auto minmax(0, 1fr) auto; }
.call summary::-webkit-details-marker { display: none; }
.call summary:hover { background: var(--sunk); }
.call summary::after { content: "Show"; font-size: 0.75rem; color: var(--muted); }
.call[open] summary::after { content: "Hide"; }
.call-body { padding: 0.25rem 0.75rem 0.75rem; display: grid; gap: 0.5rem; }
.call-server { color: var(--muted); }
.call-tool { font-family: var(--mono); font-weight: 600; }
.part-title { font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 0.2rem; }
pre {
  margin: 0; background: var(--sunk); border-radius: 3px; padding: 0.5rem 0.625rem;
  font: 0.75rem/1.5 var(--mono); white-space: pre-wrap; max-height: 16rem; overflow: auto;
}

.badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; font-weight: 600; white-space: nowrap; color: var(--muted); }
.badge::before { content: ""; width: 0.5rem; height: 0.5rem; background: currentColor; border-radius: 1px; flex: none; }
.badge.ok { color: var(--ok); }
.badge.warn { color: var(--warn); }
.badge.bad { color: var(--bad); }
.badge.info { color: var(--muted); }
.badge.info::before { background: transparent; border: 1.5px solid currentColor; }
.cost { justify-self: start; display: inline-flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; border: 1px solid var(--line); font-size: 0.6875rem; font-weight: 700; color: var(--muted); cursor: help; }
.cost:empty { display: none; }

.confirm { background: var(--surface); border: 1px solid var(--warn); border-radius: 4px; margin-bottom: 1rem; }
.confirm-head { padding: 0.75rem; display: grid; gap: 0.125rem; background: var(--warn-soft); border-radius: 3px 3px 0 0; }
.confirm-title { font-size: 0.9375rem; font-weight: 700; }
.pending { display: grid; }
.pending-card { padding: 0.75rem; border-top: 1px solid var(--line); display: grid; gap: 0.5rem; }
.pending-card[data-choice="approve"] { box-shadow: inset 3px 0 0 var(--ok); }
.pending-card[data-choice="edit"] { box-shadow: inset 3px 0 0 var(--ok); }
.pending-card[data-choice="reject"] { box-shadow: inset 3px 0 0 var(--bad); }
.pending-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.25rem 0.5rem; }
.pending-note { font-size: 0.75rem; color: var(--muted); }
.args { display: grid; gap: 0.25rem; font-size: 0.8125rem; }
.arg { display: grid; grid-template-columns: minmax(0, 8rem) minmax(0, 1fr); column-gap: 0.75rem; }
.arg-name { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.arg-value { white-space: pre-wrap; }
.arg-field { display: grid; gap: 0.125rem; }
.arg-field input[type="text"], .arg-field input[type="number"] {
  width: 100%; font: inherit; padding: 0.375rem 0.5rem; border-radius: 4px;
  border: 1px solid var(--edge); background: var(--surface); color: var(--fg);
}
.arg-field textarea { min-height: 3rem; font-family: var(--mono); font-size: 0.75rem; }
.arg-field input[aria-invalid="true"], .arg-field textarea[aria-invalid="true"] { border-color: var(--bad); }
.edit-error { font-size: 0.75rem; color: var(--bad); }
.raw summary { cursor: pointer; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
.raw summary:hover { color: var(--fg); }
.raw pre { margin-top: 0.25rem; }
.pending-actions { display: flex; align-items: center; flex-wrap: wrap; }
.pending-actions button.choice { min-height: 2rem; }
.pending-actions button.choice.approve { border-radius: 4px 0 0 4px; margin-right: -1px; }
.pending-actions button.choice.always { border-radius: 0; margin-right: -1px; }
.pending-actions button.choice.edit { border-radius: 0; margin-right: -1px; }
.pending-actions button.choice.reject { border-radius: 0 4px 4px 0; margin-right: 0.75rem; }
button.choice[aria-pressed="true"].approve { background: var(--ok); border-color: var(--ok); color: var(--surface); }
button.choice[aria-pressed="true"].always { background: var(--ok); border-color: var(--ok); color: var(--surface); }
button.choice[aria-pressed="true"].edit { background: var(--ok); border-color: var(--ok); color: var(--surface); }
button.choice[aria-pressed="true"].reject { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.confirm-foot { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0.75rem; border-top: 1px solid var(--line); }

.composer {
  flex: none; background: var(--bg);
  padding-block: 0.75rem max(0.75rem, env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line); display: grid; gap: 0.5rem;
}
textarea {
  width: 100%; min-height: 4rem; max-height: 40vh; resize: vertical; font: inherit;
  padding: 0.5rem 0.625rem; border-radius: 4px;
  border: 1px solid var(--edge); background: var(--surface); color: var(--fg);
}
textarea:focus-visible { outline-offset: 0; border-color: var(--accent); }
textarea::placeholder { color: var(--muted); }
.composer-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.composer-row .hint { margin-left: auto; }
@media (max-width: 30rem) { .composer-row .hint { display: none; } }
.error { color: var(--bad); background: var(--bad-soft); border-radius: 4px; padding: 0.4rem 0.625rem; font-size: 0.875rem; }
.turn-error { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.75rem; justify-self: start; max-width: 100%; }
.error-raw { display: block; margin-top: 0.125rem; font-size: 0.75rem; color: var(--muted); }
.working-row { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); font-size: 0.8125rem; }
.spinner {
  flex: none; width: 0.875rem; height: 0.875rem; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--accent);
}

.signin { max-width: 24rem; margin: 4rem auto; padding-inline: 16px; display: grid; gap: 0.75rem; justify-items: start; }
.signin-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: no-preference) {
  :root { interpolate-size: allow-keywords; }
  .spinner { animation: spin 0.8s linear infinite; }
  .working-label { animation: pulse 1.6s ease-in-out infinite; }
  .turn, .confirm, .working-row, .error, .jump, .empty, .turn-error { animation: rise 0.2s ease-out backwards; }
  button, .link-button { transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
  @supports selector(::details-content) {
    .call::details-content, .raw::details-content {
      block-size: 0; overflow-y: clip;
      transition: block-size 0.2s ease-out, content-visibility 0.2s allow-discrete;
    }
    .call[open]::details-content, .raw[open]::details-content { block-size: auto; }
  }
  @media (max-width: 51.99rem) {
    .rail { transition: translate 0.2s ease-out, visibility 0s 0.2s; }
    .rail[data-open] { transition: translate 0.2s ease-out; }
    .scrim { animation: fade 0.2s ease-out backwards; }
  }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <button id="rail-toggle" class="small rail-toggle" type="button" aria-expanded="false" aria-controls="rail">Conversations</button>
    <h1 class="brand">deskclerk</h1>
    <div id="who" class="who" hidden>
      <span id="status" class="muted small"></span>
      <button id="logout" class="small quiet" type="button">Sign out</button>
    </div>
  </div>
</header>

<section id="signin" class="signin" hidden>
  <h2 class="signin-title">Sign in to continue</h2>
  <p class="muted">deskclerk acts on your connected servers as you.</p>
  <p id="signin-error" class="error" role="alert" hidden></p>
  <a class="link-button primary" href="/login">Sign in</a>
</section>

<div id="app" class="shell" hidden>
  <aside id="rail" class="rail">
    <section aria-labelledby="conversations-title">
      <h2 id="conversations-title" class="heading">Conversations</h2>
      <button id="new-conversation" class="small conv-new" type="button">New conversation</button>
      <ul id="conversation-list" class="conv-list"></ul>
    </section>
    <section aria-labelledby="rail-summary">
      <h2 id="rail-summary" class="heading">Servers</h2>
      <div id="servers" class="servers"></div>
    </section>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main id="main" class="main">
    <div class="thread">
    <div id="messages" class="messages" tabindex="0" role="region" aria-labelledby="messages-title">
    <h2 id="messages-title" class="sr-only">Conversation</h2>
    <div id="empty" class="empty">
      <h2 class="empty-title">What can I help with?</h2>
      <p>Ask for something to look up or change on your connected servers.</p>
      <div id="chips" class="chips"></div>
    </div>
    <div id="turns" class="turns"></div>

    <section id="confirm" class="confirm" aria-labelledby="confirm-title" hidden>
      <div class="confirm-head">
        <h2 id="confirm-title" class="confirm-title" tabindex="-1">Confirm calls</h2>
        <p id="confirm-note" class="small"></p>
      </div>
      <div id="pending" class="pending"></div>
      <div id="confirm-foot" class="confirm-foot">
        <button id="send" class="primary" type="button" disabled>Run decisions</button>
        <span id="decided" class="muted small"></span>
      </div>
    </section>
    </div>
    <button id="jump" class="jump" type="button" aria-label="Jump to latest" hidden>Jump to latest <span aria-hidden="true">&#8595;</span></button>
    </div>

    <form id="composer" class="composer">
      <label for="request" class="sr-only">Your request</label>
      <textarea id="request" maxlength="4000" placeholder="What do you need?"></textarea>
      <p id="error" class="error" role="alert" hidden></p>
      <p id="working" class="sr-only" role="status"></p>
      <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
      <div class="composer-row">
        <button id="ask" class="primary" type="submit">Send <span aria-hidden="true">&#8593;</span></button>
        <span class="muted small hint">Enter to send, Shift+Enter for a new line</span>
      </div>
    </form>
  </main>
</div>

      verdict.className = choice === "reject" || (editing && edited === null) ? "badge bad" : "badge ok";
      if (runEdited) runEdited.disabled = edited === null;
      updateDecided(pending.length);
    };
    const undecide = () => {
      delete decisions[call.id];
      delete card.dataset.choice;
      editor.box.hidden = true;
      shown.hidden = false;
      raw.hidden = false;
      for (const choice of [approve, reject, edit, always]) if (choice) choice.setAttribute("aria-pressed", "false");
      verdict.textContent = "Not decided";
      verdict.className = "badge info";
      edit.focus();
      updateDecided(pending.length);
    };
    group.append(approve, ...(always ? [always] : []), edit, reject, verdict);
    card.append(title);
    if (call.description !== "") card.append(make("p", "small", call.description));
    card.append(shown, editor.box, raw, group);
    if (always) card.append(make("p", "pending-note", "Always allow runs this tool without asking again."));
    list.append(card);
  }
  waiting = pending.length;
  updateDecided(pending.length);
  el("confirm-foot").hidden = pending.length === 1;
  el("confirm-note").textContent = pending.length === 1
    ? "This call needs your approval before it runs."
    : "Each call below needs your approval before it runs. Approve or reject each one, then press Run decisions.";
  el("confirm").hidden = pending.length === 0;
  updateControls();
}

function showResult(result) {
  conversation = result.conversation;
  remember(conversation);
  const turn = currentTurn;
  setAnswer(turn, result.answer);
  turn.calls.replaceChildren(...buildCalls(result));
  const cost = "Cost: " + result.cost_usd.toFixed(4) + " USD";
  turn.cost.title = cost;
  turn.cost.replaceChildren(make("span", "", "i"), make("span", "sr-only", cost));
  turn.cost.firstChild.setAttribute("aria-hidden", "true");
  showPending(result.pending);
  if (result.pending.length > 0) {
    el("confirm-title").focus({ preventScroll: true });
  } else if (result.answer !== "") {
    announce("Answer ready");
  }
  revealTurn(turn.node);
}

function discardTurn(turn, previous, request) {
  turn.node.remove();
  currentTurn = previous;
  if (el("turns").childElementCount === 0) el("empty").hidden = false;
  updateJump();
  const draft = el("request").value;
  el("request").value = draft === "" ? request : request + "\n" + draft;
  fitRequest();
}

async function ask(resent) {
  showError("");
  const request = resent ?? el("request").value;
  if (request.trim() === "") return el("request").focus();
  for (const old of el("turns").querySelectorAll(".turn-error button")) old.remove();
  lastRequest = request;
  setBusy(true, "Working on it…");
  const previous = currentTurn;
  currentTurn = newTurn(request);
  const turn = currentTurn;
  const retry = () => {
    turn.node.remove();
    currentTurn = previous;
    ask(request);
  };
  following = true;
  if (resent === undefined) {
    el("request").value = "";
    fitRequest();
  }
  inFlight = request;
  const stop = startWorking(turn.node, "Working on it…");
  try {
    const response = await post("/ask", { request, conversation });
    if (!response.ok) {
      const kept = await reportFailure(response, turn, retryable(response.status) ? retry : undefined);
      if (!kept) discardTurn(turn, previous, request);
      return;
    }
    showResult(await response.json());
  } catch (error) {
    failTurn(turn, "Could not reach the server", retry);
  } finally {
    inFlight = "";
    stop();
    setBusy(false);
    loadConversations();
    if (waiting === 0) el("request").focus();
  }
}

async function send() {
  if (busy) return;
  showError("");
  el("send").disabled = true;
  setBusy(true, "Sending your decisions…");
  const stop = startWorking(currentTurn.node, "Sending your decisions…");
  try {
    const response = await post("/ask/confirm", { conversation, decisions });
    if (!response.ok) {
      if (response.status >= 500) showPending([]);
      else updateDecided(waiting);
      return await reportFailure(response, currentTurn);
    }
    showResult(await response.json());
  } catch (error) {
    updateDecided(waiting);
    showError("Could not reach the server");
  } finally {
    stop();
    setBusy(false);
    loadConversations();
    if (waiting === 0) el("request").focus();
  }
}

async function openConversation(id) {
  resetView();
  const mine = loadToken;
  try {
    const response = await api("/conversations/" + encodeURIComponent(id));
    if (mine !== loadToken) return;
    if (!response.ok) {
      if (response.status !== 404 && response.status !== 422) showError("Could not reload the conversation");
      return;
    }
    const past = await response.json();
    if (mine !== loadToken) return;
    conversation = past.conversation;
    remember(conversation);
    renderConversations(null, false);
    for (const item of past.turns) {
      lastRequest = item.request;
      currentTurn = newTurn(item.request);
      setAnswer(currentTurn, item.answer);
    }
    showPending(past.pending);
    following = true;
    scrollToBottom("auto");
    updateJump();
  } catch (error) {
    if (mine === loadToken) showError("Could not reload the conversation");
  }
}

async function start() {
  const linkError = takeLinkError();
  const response = await api("/me");
  if (!response.ok) {
    el("signin").hidden = false;
    el("signin-error").textContent = linkError;
    el("signin-error").hidden = linkError === "";
    return;
  }
  el("status").textContent = "Signed in as " + (await response.json()).name;
  el("who").hidden = false;
  el("app").hidden = false;
  restoreDraft();
  el("composer").addEventListener("submit", (event) => {
    event.preventDefault();
    if (!el("ask").disabled) ask();
  });
  el("request").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      el("composer").requestSubmit();
    } else if (event.key === "ArrowUp" && el("request").value === "" && lastRequest !== "") {
      event.preventDefault();
      el("request").value = lastRequest;
      fitRequest();
    }
  });
  el("request").addEventListener("input", fitRequest);
  el("messages").addEventListener("scroll", () => {
    following = atBottom();
    updateJump();
  });
  new ResizeObserver(() => {
    if (following) scrollToBottom("auto");
    updateJump();
  }).observe(el("messages"));
  el("jump").addEventListener("click", () => {
    following = true;
    scrollToBottom(scrollBehavior());
    el("request").focus({ preventScroll: true });
  });
  el("send").addEventListener("click", send);
  el("new-conversation").addEventListener("click", newConversation);
  el("logout").addEventListener("click", logout);
  el("rail-toggle").addEventListener("click", () => setDrawer(!drawerOpen(), true));
  el("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeDrawer();
  });
  phone.addEventListener("change", () => setDrawer(false, false));
  setDrawer(false, false);
  window.addEventListener("hashchange", () => {
    const id = remembered();
    if (id === null) newConversation();
    else if (id !== conversation && !busy) openConversation(id);
  });
  loadServers();
  loadConversations();
  const linked = remembered();
  if (linked !== null) openConversation(linked);
  if (linkError !== "") showError(linkError);
}

start();
</script>
</body>
</html>
