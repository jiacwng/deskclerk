<!doctype html>
<!-- The demo chat page: sign in through the company's identity provider, ask a question, read the answer, its SQL and its sources. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>needtoknow</title>
<style>
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 0 auto; padding: 0 1rem 3rem; color: #222; line-height: 1.5; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 0; margin-bottom: 1.5rem; border-bottom: 1px solid #ddd; }
  h1 { margin: 0; font-size: 1.5rem; }
  #account { display: flex; align-items: center; gap: 0.75rem; }
  #who { margin: 0; color: #555; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input { flex: 1; padding: 0.5rem; font: inherit; border: 1px solid #bbb; border-radius: 4px; }
  button { padding: 0.5rem 0.9rem; font: inherit; border: 1px solid #bbb; border-radius: 4px; background: #fff; cursor: pointer; }
  button:hover:not(:disabled) { background: #eee; }
  #suggestions { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; margin-bottom: 1rem; }
  #suggestions p { margin: 0; color: #555; }
  #suggestions button { text-align: left; }
  #error { color: #b00020; }
  .reply { border-left: 4px solid #2a7; padding: 0.5rem 1rem; margin: 1rem 0; background: #f6f6f6; border-radius: 0 4px 4px 0; }
  .reply.refused { border-left-color: #b00020; }
  .question { font-weight: bold; }
  .label { color: #b00020; font-weight: bold; }
  pre { background: #fff; padding: 0.5rem; overflow-x: auto; max-height: 20rem; }
</style>
</head>
<body>
<header>
  <h1>needtoknow</h1>
  <div id="account">
    <p id="who" hidden></p>
    <button id="logout" type="button" hidden>Sign out</button>
  </div>
</header>
<form id="login">
  <button>Sign in</button>
</form>
<div id="suggestions" hidden></div>
<form id="ask" hidden>
  <input name="question" placeholder="Ask a question" maxlength="2000" required>
  <button>Ask</button>
</form>
<p id="error"></p>
<div id="replies"></div>
<script>
  const login = document.getElementById("login");
  const ask = document.getElementById("ask");
  const who = document.getElementById("who");
  const error = document.getElementById("error");
  const replies = document.getElementById("replies");
  const logout = document.getElementById("logout");
  const suggestions = document.getElementById("suggestions");
  // The tokens live in these variables only, so a reload signs in again. The PKCE verifier and
  // the state survive the trip to the login page in sessionStorage (RFC 7636). The access token
  // is renewed with the refresh token shortly before it expires, and once more on a 401.
  let token = null;
  let refreshToken = null;
  let idToken = null;
  let refreshTimer = null;
  const REFRESH_EARLY_SECONDS = 30;
  const redirectUri = location.origin + location.pathname;

  function keep(tokens) {
    token = tokens.access_token;
    refreshToken = tokens.refresh_token ?? null;
    idToken = tokens.id_token ?? idToken;
    clearTimeout(refreshTimer);
    if (refreshToken !== null && typeof tokens.expires_in === "number") {
      const seconds = Math.max(tokens.expires_in - REFRESH_EARLY_SECONDS, 1);
      refreshTimer = setTimeout(refresh, seconds * 1000);
    }
  }

  async function refresh() {
    if (refreshToken === null) {
      return false;
    }
    const { config, endpoints } = await provider();
    const response = await fetch(endpoints.token_endpoint, {
      method: "POST",
      body: new URLSearchParams({
        grant_type: "refresh_token",
        client_id: config.client_id,
        refresh_token: refreshToken,
      }),
    });
    if (!response.ok) {
      refreshToken = null;
      return false;
    }
    keep(await response.json());
    return true;
  }

  function signedIn(yes) {
    login.hidden = yes;
    ask.hidden = !yes;
    who.hidden = !yes;
    logout.hidden = !yes;
    suggestions.hidden = !yes;
    who.textContent = yes ? `Signed in as ${usernameOf(idToken)}` : "";
  }

  function usernameOf(jwt) {
    const payload = jwt.split(".")[1].replaceAll("-", "+").replaceAll("_", "/");
    const bytes = Uint8Array.from(atob(payload), (character) => character.charCodeAt(0));
    const claims = JSON.parse(new TextDecoder().decode(bytes));
    return claims.preferred_username ?? claims.sub;
  }

  const SUGGESTED_QUESTIONS = [
    "Who in Vince Kaminski's group helps with the Wharton and Rice projects?",
    "What is the proposal to extend the rate freeze, and which bill was it first attached to?",
    "Why was the signing of phase II of the Lagos State project delayed?",
  ];
  const hint = document.createElement("p");
  hint.textContent = "Try asking:";
  suggestions.append(hint);
  for (const text of SUGGESTED_QUESTIONS) {
    const suggestion = document.createElement("button");
    suggestion.type = "button";
    suggestion.textContent = text;
    suggestion.addEventListener("click", () => {
      ask.elements.question.value = text;
      ask.elements.question.focus();
    });
    suggestions.append(suggestion);
  }

  logout.addEventListener("click", async () => {
    const hintToken = idToken;
    forget();
    signedIn(false);
    const { config, endpoints } = await provider();
    if (!endpoints.end_session_endpoint) {
      return;
    }
    const query = new URLSearchParams({
      client_id: config.client_id,
      id_token_hint: hintToken,
      post_logout_redirect_uri: redirectUri,
    });
    location.assign(`${endpoints.end_session_endpoint}?${query}`);
  });

  function randomText() {
    return base64url(crypto.getRandomValues(new Uint8Array(32)));
  }

  function base64url(bytes) {
    return btoa(String.fromCharCode(...new Uint8Array(bytes)))
      .replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
  }

  async function provider() {
    const config = await (await fetch("/config")).json();
    const discovery = await fetch(`${config.issuer}/.well-known/openid-configuration`);
    return { config, endpoints: await discovery.json() };
  }

  login.addEventListener("submit", async (event) => {
    event.preventDefault();
    const { config, endpoints } = await provider();
    const verifier = randomText();
    const state = randomText();
    sessionStorage.setItem("pkce", JSON.stringify({ verifier, state }));
    const challenge = base64url(
      await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)),
    );
    const query = new URLSearchParams({
      response_type: "code",
      client_id: config.client_id,
      redirect_uri: redirectUri,
      scope: config.scope,
      state,
      code_challenge: challenge,
      code_challenge_method: "S256",
    });
    location.assign(`${endpoints.authorization_endpoint}?${query}`);
  });

  async function finishSignIn() {
    const answer = new URLSearchParams(location.search);
    if (!answer.has("code") && !answer.has("error")) {
      return;
    }
    const saved = JSON.parse(sessionStorage.getItem("pkce") ?? "null");
    sessionStorage.removeItem("pkce");
    history.replaceState(null, "", redirectUri);
    if (saved === null || answer.get("state") !== saved.state || !answer.has("code")) {
      error.textContent = "sign in failed, try again";
      return;
    }
    const { config, endpoints } = await provider();
    const response = await fetch(endpoints.token_endpoint, {
      method: "POST",
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: config.client_id,
        code: answer.get("code"),
        redirect_uri: redirectUri,
        code_verifier: saved.verifier,
      }),
    });
    if (!response.ok) {
      error.textContent = "sign in failed, try again";
      return;
    }
    keep(await response.json());
    signedIn(true);
  }

  finishSignIn();

  // The server keeps no conversation: the page sends the latest turns that fit the API's caps.
  const MAX_HISTORY_TURNS = 10;
  const MAX_HISTORY_CHARS = 20000;
  const conversation = [];

  function recentHistory() {
    const history = [];
    let chars = 0;
    for (let i = conversation.length - 1; i >= 0 && history.length < MAX_HISTORY_TURNS; i--) {
      chars += conversation[i].question.length + conversation[i].answer.length;
      if (chars > MAX_HISTORY_CHARS) {
        break;
      }
      history.unshift(conversation[i]);
    }
    return history;
  }

  ask.addEventListener("submit", async (event) => {
    event.preventDefault();
    error.textContent = "";
    const question = new FormData(ask).get("question");
    const button = ask.querySelector("button");
    button.disabled = true;
    try {
      await stream(question);
    } finally {
      button.disabled = false;
    }
  });

  function send(question) {
    return fetch("/ask/stream", {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ question, history: recentHistory() }),
    });
  }

  async function stream(question) {
    let response = await send(question);
    if (response.status === 401 && await refresh()) {
      response = await send(question);
    }
    if (response.status === 401) {
      forget();
      signedIn(false);
      error.textContent = "login expired, sign in again";
      return;
    }
    if (!response.ok) {
      const body = await response.json();
      error.textContent = typeof body.detail === "string" ? body.detail : `error ${response.status}`;
      return;
    }
    const parts = start(question);
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) {
        break;
      }
      buffer += value;
      const blocks = buffer.split("\n\n");
      buffer = blocks.pop();
      for (const block of blocks) {
        const message = parse(block);
        if (message.event === "tool") {
          const step = document.createElement("li");
          step.textContent = message.data.sql === null ? message.data.name : `${message.data.name}: ${message.data.sql}`;
          parts.steps.append(step);
        } else if (message.event === "token") {
          parts.answer.textContent += message.data;
        } else if (message.event === "answer") {
          suggestions.hidden = true;
          finish(parts, message.data);
          conversation.push({ question, answer: message.data.answer });
          ask.reset();
        } else if (message.event === "error") {
          parts.reply.remove();
          error.textContent = message.data.detail;
        }
      }
    }
  }

  function forget() {
    token = null;
    refreshToken = null;
    idToken = null;
    clearTimeout(refreshTimer);
    conversation.length = 0;
  }

  function parse(block) {
    let event = "message";
    const data = [];
    for (const line of block.split("\n")) {
      if (line.startsWith("event: ")) {
        event = line.slice("event: ".length);
      } else if (line.startsWith("data: ")) {
        data.push(line.slice("data: ".length));
      }
    }
    return { event, data: data.length > 0 ? JSON.parse(data.join("\n")) : null };
  }

  function start(question) {
    const reply = document.createElement("div");
    reply.className = "reply";
    const asked = document.createElement("p");
    asked.className = "question";
    asked.textContent = question;
    const steps = document.createElement("ul");
    const answer = document.createElement("p");
    reply.append(asked, steps, answer);
    replies.prepend(reply);
    return { reply, steps, answer };
  }

  // The model cites a document as [id] and writes bold as **text**: the cited ids are listed
  // under Sources, so they leave the text, and bold is built as elements, never as HTML.
  function showAnswer(element, text, citations) {
    let plain = text;
    for (const source of citations) {
      plain = plain.replaceAll(` [${source.doc_id}]`, "").replaceAll(`[${source.doc_id}]`, "");
    }
    element.replaceChildren();
    plain.split("**").forEach((piece, index) => {
      if (index % 2 === 1) {
        const strong = document.createElement("strong");
        strong.textContent = piece;
        element.append(strong);
      } else {
        element.append(piece);
      }
    });
  }

  function finish(parts, body) {
    const reply = parts.reply;
    parts.steps.remove();
    showAnswer(parts.answer, body.answer, body.citations);
    if (body.refused) {
      reply.className = "reply refused";
      const label = document.createElement("p");
      label.className = "label";
      label.textContent = "Refused";
      parts.answer.before(label);
    }
    if (body.queries.length > 0) {
      const queries = document.createElement("div");
      queries.className = "queries";
      for (const query of body.queries) {
        const code = document.createElement("code");
        code.textContent = query.sql;
        const sql = document.createElement("pre");
        sql.append(code);
        const result = document.createElement("pre");
        result.textContent = query.error ?? query.rows;
        queries.append(sql, result);
      }
      const label = document.createElement("p");
      label.className = "label";
      label.textContent = "Queries:";
      reply.append(label, queries);
    }
    if (body.citations.length > 0) {
      const list = document.createElement("ul");
      for (const source of body.citations) {
        const item = document.createElement("li");
        item.textContent = source.title === "" ? source.doc_id : source.title;
        item.title = source.doc_id;
        list.append(item);
      }
      reply.append("Sources:", list);
    }
  }
</script>
</body>
</html>
