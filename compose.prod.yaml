# The web app alone for a company deploy, reachable from this machine only. Point .env at your
# own login server.
services:
  deskclerk:
    build: .
    env_file: .env
    environment:
      DESKCLERK_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./servers.toml
        target: /app/servers.toml
        read_only: true
        bind:
          create_host_path: false
      - deskclerk-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  deskclerk-data:
