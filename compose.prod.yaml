# One server for a company. Start it with docker compose -f compose.prod.yaml up -d --wait; the
# load service provisions the database first, and the company's files are loaded afterwards with
# docker compose -f compose.prod.yaml run --rm load. Caddy is the only public entry and gets a TLS certificate for NEEDTOKNOW_DOMAIN; it serves the chat
# page and API at /, the MCP server at /mcp and the Keycloak login at /auth. Every password
# comes from the environment and the stack refuses to start without one. The app and the MCP
# server get only the settings they read, passed through from .env, so the admin and owner
# passwords and the Keycloak bootstrap password never reach them. Keycloak's admin console is
# published on 127.0.0.1:8080 for an SSH tunnel and is not served by Caddy.
services:
  caddy:
    image: caddy:2.11.7
    environment:
      NEEDTOKNOW_DOMAIN: ${NEEDTOKNOW_DOMAIN:?set NEEDTOKNOW_DOMAIN}
      NEEDTOKNOW_ACME_EMAIL: ${NEEDTOKNOW_ACME_EMAIL:?set NEEDTOKNOW_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: needtoknow
      POSTGRES_PASSWORD: ${NEEDTOKNOW_ADMIN_PASSWORD:?set NEEDTOKNOW_ADMIN_PASSWORD}
      POSTGRES_DB: needtoknow
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/keycloak-db.sh:/docker-entrypoint-initdb.d/keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needtoknow -d needtoknow"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start", "--import-realm"]
    environment:
      NEEDTOKNOW_DOMAIN: ${NEEDTOKNOW_DOMAIN}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://${NEEDTOKNOW_DOMAIN}/auth
      KC_HOSTNAME_ADMIN: http://localhost:8080/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /auth/health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '^HTTP/1.[01] 200' <&3
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Runs needtoknow.ingest on the folder ./documents, mounted as /data, then exits. Started with
  # the stack it creates the roles and tables and does nothing else, so the app and the MCP
  # server find a provisioned database. A folder of files with its access file is loaded, and
  # reloaded after files change or go, with
  # docker compose -f compose.prod.yaml run --rm load files /data/files
  # --access /data/access.jsonl --delete-missing
  load:
    build: .
    entrypoint: ["python", "-m", "needtoknow.ingest"]
    command: ["reindex"]
    environment:
      NEEDTOKNOW_DB_HOST: db
      NEEDTOKNOW_ADMIN_PASSWORD: ${NEEDTOKNOW_ADMIN_PASSWORD}
      NEEDTOKNOW_OWNER_PASSWORD: ${NEEDTOKNOW_OWNER_PASSWORD:?set NEEDTOKNOW_OWNER_PASSWORD}
      NEEDTOKNOW_APP_PASSWORD: ${NEEDTOKNOW_APP_PASSWORD:?set NEEDTOKNOW_APP_PASSWORD}
    volumes:
      - ./documents:/data:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      NEEDTOKNOW_DB_HOST: db
      NEEDTOKNOW_APP_PASSWORD: ${NEEDTOKNOW_APP_PASSWORD}
      NEEDTOKNOW_ISSUER: https://${NEEDTOKNOW_DOMAIN}/auth/realms/needtoknow
      NEEDTOKNOW_JWKS_URL: http://keycloak:8080/auth/realms/needtoknow/protocol/openid-connect/certs
      NEEDTOKNOW_MCP_URL: https://${NEEDTOKNOW_DOMAIN}/mcp
      NEEDTOKNOW_PUBLIC_RELATIONS: ${NEEDTOKNOW_PUBLIC_RELATIONS:-}
      NEEDTOKNOW_MODEL:
      NEEDTOKNOW_PRICE_INPUT:
      NEEDTOKNOW_PRICE_OUTPUT:
      NEEDTOKNOW_BUDGET_USD:
      NEEDTOKNOW_SCREEN:
      NEEDTOKNOW_AUDIT_TEXT:
      NEEDTOKNOW_AUDIT_KEY:
      NEEDTOKNOW_REQUESTS_PER_MINUTE:
      NEEDTOKNOW_POOL_SIZE:
      NEEDTOKNOW_USER_CLAIM:
      NEEDTOKNOW_GROUPS_CLAIM:
      NEEDTOKNOW_GRAPH_TENANT_ID:
      NEEDTOKNOW_GRAPH_CLIENT_ID:
      NEEDTOKNOW_GRAPH_CLIENT_SECRET:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      OLLAMA_HOST:
      TYPESAFE_API_KEY:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=12)
      interval: 5s
      timeout: 15s
      retries: 30
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      load:
        condition: service_completed_successfully

  mcp:
    build: .
    command: ["python", "-m", "needtoknow.mcp_server"]
    environment:
      NEEDTOKNOW_DB_HOST: db
      NEEDTOKNOW_APP_PASSWORD: ${NEEDTOKNOW_APP_PASSWORD}
      NEEDTOKNOW_ISSUER: https://${NEEDTOKNOW_DOMAIN}/auth/realms/needtoknow
      NEEDTOKNOW_JWKS_URL: http://keycloak:8080/auth/realms/needtoknow/protocol/openid-connect/certs
      NEEDTOKNOW_MCP_URL: https://${NEEDTOKNOW_DOMAIN}/mcp
      NEEDTOKNOW_MCP_HOST: 0.0.0.0
      NEEDTOKNOW_PUBLIC_RELATIONS: ${NEEDTOKNOW_PUBLIC_RELATIONS:-}
      NEEDTOKNOW_BUDGET_USD:
      NEEDTOKNOW_SCREEN:
      NEEDTOKNOW_AUDIT_TEXT:
      NEEDTOKNOW_AUDIT_KEY:
      NEEDTOKNOW_REQUESTS_PER_MINUTE:
      NEEDTOKNOW_POOL_SIZE:
      NEEDTOKNOW_USER_CLAIM:
      NEEDTOKNOW_GROUPS_CLAIM:
      TYPESAFE_API_KEY:
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      load:
        condition: service_completed_successfully

volumes:
  db-data:
  caddy-data:
  caddy-config:
