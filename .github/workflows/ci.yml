name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: docker compose up -d --wait keycloak postgres demo
      - run: pytest
        env:
          DESKCLERK_DEMO_URL: http://localhost:8100/mcp
      - name: container sends sign-in to keycloak
        run: |
          {
            echo "ANTHROPIC_API_KEY=unused"
            echo "DESKCLERK_TOKEN_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(16))')"
            echo "DESKCLERK_SESSION_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          } > .env
          cp servers.example.toml servers.toml
          docker compose -f compose.prod.yaml config -q
          docker compose up -d --wait deskclerk
          curl -fsS -o /dev/null -w '%{redirect_url}' http://localhost:8000/login \
            | grep '^http://localhost:8080/realms/deskclerk/protocol/openid-connect/auth?'

  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/deskclerk -f charts/deskclerk/ci/values.yaml
      - run: docker build -t deskclerk:ci .
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - run: kind load docker-image deskclerk:ci --name chart-testing
      - name: start postgres and a stub login server
        run: |
          kubectl apply -f charts/deskclerk/ci/dependencies.yaml
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl rollout status deployment/oidc-stub --timeout=120s
      - name: install the chart
        run: |
          kubectl create secret generic deskclerk \
            --from-literal=DESKCLERK_DATABASE_URL=postgresql://deskclerk:ci@postgres:5432/deskclerk \
            --from-literal=DESKCLERK_TOKEN_KEY="$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            --from-literal=DESKCLERK_SESSION_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" \
            --from-literal=DESKCLERK_AUDIT_CHAIN_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" \
            --from-literal=ANTHROPIC_API_KEY=unused
          helm install deskclerk charts/deskclerk -f charts/deskclerk/ci/values.yaml --wait --timeout 3m
      - name: livez answers
        run: |
          kubectl port-forward service/deskclerk 8000:80 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8000/livez
      - name: pod state and logs on failure
        if: failure()
        run: |
          kubectl get pods
          kubectl logs deployment/deskclerk --tail=100 || true
