name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: docker compose up -d --wait keycloak postgres
      - run: pytest
      - name: container sends sign-in to keycloak
        run: |
          {
            echo "ANTHROPIC_API_KEY=unused"
            echo "DESKCLERK_ALLOW_UNSCREENED=true"
            echo "DESKCLERK_TOKEN_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(16))')"
            echo "DESKCLERK_SESSION_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          } > .env
          cp servers.example.toml servers.toml
          docker compose -f compose.prod.yaml config -q
          docker compose up -d --wait deskclerk
          curl -fsS -o /dev/null -w '%{redirect_url}' http://localhost:8000/login \
            | grep '^http://localhost:8080/realms/deskclerk/protocol/openid-connect/auth?'
