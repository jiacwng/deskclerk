name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: needtoknow
          POSTGRES_PASSWORD: needtoknow
          POSTGRES_DB: needtoknow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U needtoknow -d needtoknow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NEEDTOKNOW_MODEL_CACHE: /home/runner/.cache/needtoknow/models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Keycloak
        run: >-
          docker run -d --name keycloak -p 8080:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          -v "$PWD/keycloak:/opt/keycloak/data/import:ro"
          quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NEEDTOKNOW_MODEL_CACHE }}
          key: model-bge-small-en-v1.5-onnx-Q
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - name: Wait for Keycloak
        run: >-
          timeout 180 bash -c 'until curl -sf
          http://localhost:8080/realms/needtoknow/.well-known/openid-configuration > /dev/null;
          do sleep 2; done' || { docker logs keycloak; exit 1; }
      - run: pytest
      - name: Check that the app role reads only protected data
        run: python -m needtoknow.exposure
        env:
          PYTHONPATH: src
