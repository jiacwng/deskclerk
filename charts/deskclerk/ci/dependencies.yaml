apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-stub
data:
  openid-configuration: |
    {"issuer": "http://oidc-stub",
     "authorization_endpoint": "http://oidc-stub/authorize",
     "token_endpoint": "http://oidc-stub/token",
     "jwks_uri": "http://oidc-stub/jwks"}
  jwks: '{"keys": []}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-stub
spec:
  selector:
    matchLabels: {app: oidc-stub}
  template:
    metadata:
      labels: {app: oidc-stub}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: files, mountPath: /usr/share/nginx/html/.well-known/openid-configuration, subPath: openid-configuration}
            - {name: files, mountPath: /usr/share/nginx/html/jwks, subPath: jwks}
      volumes:
        - name: files
          configMap: {name: oidc-stub}
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-stub
spec:
  selector: {app: oidc-stub}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: deskclerk}
            - {name: POSTGRES_PASSWORD, value: ci}
            - {name: POSTGRES_DB, value: deskclerk}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec:
              command: [pg_isready, -U, deskclerk, -d, deskclerk]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
