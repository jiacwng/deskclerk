# Local services, reachable from this machine only.
services:
  # Development login server. The realm in keycloak/ holds the six users of the public data, each
  # with the password deskclerk; the admin console account is admin / admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8100:8100"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/deskclerk/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '^HTTP/1.[01] 200' <&3
      interval: 2s
      timeout: 5s
      retries: 60

  # A small task list server on http://localhost:8100/mcp with no sign-in, for trying deskclerk
  # without an account. It starts empty and keeps its tasks in memory.
  demo:
    build: .
    network_mode: "service:keycloak"
    command: ["python", "/app/demo/tasks_server.py"]
    volumes:
      - ./demo/tasks_server.py:/app/demo/tasks_server.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8100), 2).close()
      interval: 2s
      timeout: 5s
      retries: 30

  # The web app on http://localhost:8000. It shares keycloak's network, so the issuer, the
  # sign-in redirect and MCP servers on localhost keep the addresses the browser uses. keycloak
  # publishes ports 8000 and 8100 for it and for demo.
  deskclerk:
    build: .
    network_mode: "service:keycloak"
    env_file: .env
    environment:
      DESKCLERK_HOST: 0.0.0.0
    volumes:
      - type: bind
        source: ./servers.toml
        target: /app/servers.toml
        read_only: true
        bind:
          create_host_path: false
      - deskclerk-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
      demo:
        condition: service_healthy

volumes:
  deskclerk-data:
