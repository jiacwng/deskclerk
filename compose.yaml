# Local services, reachable from this machine only.
services:
  # Development login server. The realm in keycloak/ holds the six users of the public data, each
  # with the password deskclerk; the admin console account is admin / admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /realms/deskclerk/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '^HTTP/1.[01] 200' <&3
      interval: 2s
      timeout: 5s
      retries: 60

  # The web app on http://localhost:8000. It shares the host's network, so the issuer, the
  # sign-in redirect and MCP servers on localhost keep the addresses the browser uses.
  deskclerk:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - type: bind
        source: ./servers.toml
        target: /app/servers.toml
        read_only: true
        bind:
          create_host_path: false
      - deskclerk-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  deskclerk-data:
